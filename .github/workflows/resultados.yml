name: Atualizar resultados do YouTube

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Salvador
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora
  push:
    paths: ["js/projetos.js"]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/youtube-resultados.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Salvar se mudou
        run: |
          if ! git diff --quiet data/resultados.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/resultados.json
            git commit -m "Resultados do YouTube atualizados"
            git push
          fi
